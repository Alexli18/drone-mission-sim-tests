name: PX4 image
description: >-
  Restore the pinned PX4 SITL image from the Actions cache, or pull it by
  digest and cache it, then make it available under a local tag. Tests run
  that tag with --pull never, so a missing image fails instead of pulling.
  Needs the package installed (reads the pin from config.yaml).
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        mkdir -p ~/.cache/px4-image
        digest="$(python -m framework.config digest)"
        echo "key=px4-image-${digest#sha256:}" >> "$GITHUB_OUTPUT"
        echo "image=$(python -m framework.config image)" >> "$GITHUB_OUTPUT"
        echo "tag=$(python -m framework.config local-tag)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/px4-image/image.tar
        key: ${{ steps.pin.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker pull "${{ steps.pin.outputs.image }}"
        docker tag "${{ steps.pin.outputs.image }}" "${{ steps.pin.outputs.tag }}"
        docker save -o ~/.cache/px4-image/image.tar "${{ steps.pin.outputs.tag }}"
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i ~/.cache/px4-image/image.tar
    - shell: bash
      run: docker image inspect "${{ steps.pin.outputs.tag }}" --format 'local image {{.Id}}'
