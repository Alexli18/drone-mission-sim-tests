name: sim-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "Times to run every suite (3 = same as the nightly run)"
        type: choice
        options: ["1", "3"]
        default: "1"
  schedule:
    # Nightly: every suite 3 times, for the pass rate. Off the hour, because
    # GitHub delays or drops scheduled runs at the top of the hour.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: shellcheck scripts/*.sh
      - run: pytest -m unit
      # Primes the image cache once per workflow run, so sim jobs do not pull.
      - uses: ./.github/actions/px4-image

  sim:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [basic, survey, failsafes]
        run: ${{ fromJSON((github.event_name == 'schedule' || inputs.runs == '3') && '[1,2,3]' || '[1]') }}
        include:
          - suite: basic
            files: tests/test_smoke.py tests/test_basic_flight.py
          - suite: survey
            files: tests/test_survey_mission.py
          - suite: failsafes
            files: tests/test_failsafes.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: ./.github/actions/px4-image
      - run: >-
          pytest -m sitl ${{ matrix.files }}
          --junitxml=artifacts/junit/${{ matrix.suite }}-${{ matrix.run }}.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.suite }}-${{ matrix.run }}
          path: artifacts/
          if-no-files-found: warn
      # JUnit alone, so the report job does not download telemetry and ULogs.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}-${{ matrix.run }}
          path: artifacts/junit/
          if-no-files-found: warn

  report:
    needs: sim
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: artifacts/
      # Reports only; a failed sim entry already makes the workflow red.
      - run: python scripts/summarize.py artifacts/ >> "$GITHUB_STEP_SUMMARY"
