name: spike-m1

# Runs the M1 spikes S1-S4 once, on demand. Results are read from the job log
# and written back into docs/designs/drone_mission_sim_tests.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PX4_IMAGE: px4io/px4-sitl:v1.18.0-rc1@sha256:39d5a950208a5a45fccbbb0670bd8716663ed0b350ef738447581395e0c92d97
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mavsdk-grpc==4.0.5
      - name: Pull image
        run: docker pull "$PX4_IMAGE"
      - name: Run spikes
        run: python spikes/m1_spike.py --workdir "$RUNNER_TEMP/spike-out"
      - name: Upload data dirs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-m1-data
          path: ${{ runner.temp }}/spike-out
          if-no-files-found: ignore
