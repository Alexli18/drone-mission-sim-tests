# PX4 parameters for holding a straight line 0.4 m above the ground in SIH, found by
# spikes (docs/qa-notes.md, "Low-altitude line following"). A scenario selects this
# set with `profile: low_altitude`; its own px4_params win over it.
#
# SIMULATION ONLY: EKF2_IMU_CTRL 0 switches the estimator's gyro-bias, accel-bias
# and gravity-vector states off. SIH's simulated IMU has no bias, so those states
# only add attitude error there. A real IMU has bias; on a real vehicle leave
# EKF2_IMU_CTRL at its default.
px4_params:
  # Height: the baro is the reference and the range finder aids it over a nearly
  # fixed terrain. With GNSS as the height reference the vehicle sometimes stayed on
  # the ground while the estimate showed 0.5 to 1.5 m.
  EKF2_HGT_REF: 0          # 0 = barometer
  EKF2_GPS_CTRL: 5
  EKF2_RNG_CTRL: 2         # range aiding when the range finder is plausible
  EKF2_TERR_NOISE: 0.5
  # Estimator noise raised: at the default noise the attitude error made the vehicle
  # wander sideways (the estimate led the vehicle up to 1 m off the line).
  EKF2_ACC_NOISE: 1.0
  EKF2_GYR_NOISE: 0.1
  # Simulation only, see above.
  EKF2_IMU_CTRL: 0
  # Shortest output-predictor time constants: the estimate follows the EKF states
  # with less lag (default 0.25 s).
  EKF2_TAU_POS: 0.1
  EKF2_TAU_VEL: 0.1
  # Stiffer position and velocity loops.
  MPC_XY_P: 1.8
  MPC_XY_VEL_P_ACC: 4.0
  MPC_XY_VEL_I_ACC: 2.0
  MPC_XY_TRAJ_P: 1.0
  MPC_Z_P: 1.5
  MPC_Z_VEL_P_ACC: 8.0
  MPC_Z_VEL_I_ACC: 3.0
