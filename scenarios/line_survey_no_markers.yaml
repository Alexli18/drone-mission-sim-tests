name: line_survey_no_markers
type: line_survey
description: "A clean line (weekly): the detector must report no marker."
profile: low_altitude
line: {start_north_m: 5.0, start_east_m: 0.0, heading_deg: 0.0, length_m: 12.0}
sensor_height_m: 0.4
sensor_offset_m: {x: 0.15, y: 0.0, z: 0.0}
speed_m_s: 1.0
markers: []
clock: {offset_ms: 0.0, jitter_ms: 0.0}
seed: 0
schedule: weekly
px4_params:
  UXRCE_DDS_SYNCT: 0
