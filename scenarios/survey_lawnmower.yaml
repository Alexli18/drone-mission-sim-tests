name: survey_lawnmower
type: mission
description: Lawnmower survey over a 60 x 40 m rectangle, 10 m line spacing, 15 m altitude, 5 m/s.
altitude_m: 15
speed_m_s: 5
area: {origin_north_m: 10, origin_east_m: 10, width_m: 60, height_m: 40, line_spacing_m: 10}
# Duration of the measured interval (first MISSION to mission finished), in
# simulated seconds. The first estimate (81 s) assumed a constant 5 m/s; CI run
# 41712414581 showed PX4 nearly stops at each 90-degree corner, so:
#   implicit takeoff to MIS_TAKEOFF_ALT 15 m (incl. spool-up)     ~20 s
#   7 lines x 40 m at ~12.8 s each (avg ~3.2 m/s)                 ~90 s
#   6 connectors x 10 m at ~5.2 s each                            ~31 s
#   estimate T ~ 141 s; bounds 0.8 x T and 1.5 x T + 30 s
duration_bounds_s: {min_s: 113, max_s: 242}
