name: low_battery
type: failsafe
description: The simulated battery drains during the survey; Return at critical, then Land at emergency.
altitude_m: 15
speed_m_s: 5
area: {origin_north_m: 10, origin_east_m: 10, width_m: 100, height_m: 100, line_spacing_m: 10}
# SIM_BAT_DRAIN = (T / 2) / 0.8 with T ~ 240 s -> 150 s: critical (20 %) at
# ~120 s after arming, emergency (5 %) at ~142 s. The drain starts at arming.
px4_params:
  SIM_BAT_DRAIN: 150
  SIM_BAT_MIN_PCT: 2
  BAT_LOW_THR: 0.30
  BAT_CRIT_THR: 0.20
  BAT_EMERGEN_THR: 0.05
  COM_LOW_BAT_ACT: 3
failure:
  kind: low_battery
expected:
  mode_reached: RETURN_TO_LAUNCH
  allowed_before: [HOLD]
  then_mode: LAND
  landed: true
  disarmed: true
  max_dist_from_home_m: null   # the emergency Land may happen before home
