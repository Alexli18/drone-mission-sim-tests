name: gps_loss
type: failsafe
description: GPS fails 60 simulated seconds into the survey; the vehicle must leave Mission, land and disarm.
altitude_m: 15
speed_m_s: 5
area: {origin_north_m: 10, origin_east_m: 10, width_m: 100, height_m: 100, line_spacing_m: 10}
px4_params: {SYS_FAILURE_EN: 1, EKF2_NOAID_TOUT: 5000000, COM_POS_FS_EPH: 5}
# Sizing: the survey takes ~240 simulated s; after 60 s about 180 s remain, far
# more than the ~6 s reaction (estimator timeout 5 s). Spike S8 showed MAVSDK
# reports the blind descent as LAND.
failure:
  kind: gps_loss
  trigger: {type: after_s, value: 60}
expected:
  leave_mode: MISSION
  landed: true
  disarmed: true
  max_dist_from_home_m: null   # the descent is blind
