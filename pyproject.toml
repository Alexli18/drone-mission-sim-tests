[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drone-mission-sim-tests"
version = "0.1.0"
description = "Simulation-based tests for PX4 drone missions: SIH SITL, failure injection, CI gates"
requires-python = ">=3.11"
dependencies = [
    # The flight jobs write allure-results (framework/reporting.py); inert without --alluredir.
    "allure-pytest==2.16.2",
    "mavsdk-grpc==4.0.5",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# pytest-xdist: the unit job runs `pytest -m unit -n 2`.
dev = ["ruff==0.17.3", "pytest-xdist==3.8.0"]
# The ROS tests: the rosbridge client and the pure survey code (docs/ros-bridge.md); pyulog
# reads the flight log after the flight (framework/ulog_checks.py).
ros = ["roslibpy==1.7.0", "numpy==1.26.4", "pyulog==1.3.0"]
# Figures of a flight from its log (scripts/flight_figures.py).
plots = ["matplotlib==3.9.2", "numpy==1.26.4", "pyulog==1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pure sensor_bridge and survey_demo modules on the runner, without installing the
# ROS packages.
pythonpath = ["ros2_ws/src/sensor_bridge", "ros2_ws/src/survey_demo"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "sitl: needs a running PX4 SITL container",
    "unit: runs without a simulator",
    "scenario(file): the scenario file a test flies",
    "ros: line survey with the ROS container (PX4 and ROS)",
    "weekly: only in the weekly schedule",
]
junit_family = "xunit1"
junit_logging = "system-out"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
